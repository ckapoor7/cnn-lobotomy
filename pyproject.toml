[project]
name = "cnn-lobotomy"
version = "0.1.0"
description = "Interactive explorer for finding, visualizing and ablating the kernels of a ResNet18 trained on CIFAR-100"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "torch>=2.4",
    "torchvision>=0.19",
]

[tool.uv]
package = false  # a set of scripts run with `uv run`, not an installable library
